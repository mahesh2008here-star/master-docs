name: Build MASTER DOCS Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run lint

      - name: Production Web Build
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Capacitor Android Sync
        run: npx cap sync android

      - name: Build Android APKs (Debug & Release)
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK Output
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Master-Docs-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Master-Docs-release.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: MASTER DOCS Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          body: |
            ## MASTER DOCS - Universal Document Reader & Editor
            
            ### Included Attachments
            - `app-release-unsigned.apk` (MASTER DOCS Unsigned Production Release APK)
            - `app-debug.apk` (MASTER DOCS Debug APK)
            
            ### Installation Instructions
            1. Download `app-release-unsigned.apk` or `app-debug.apk` to your Android device.
            2. Enable **Install from unknown sources** in your Android device settings if prompted.
            3. Tap the downloaded APK to install and launch MASTER DOCS on Android 7.0+ (API 24+).
            
            *Note: The release build is provided as an unsigned production APK. For Google Play distribution, sign the APK using your release key.*
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
